<!doctype html>
<!-- Interfejs działa bez Node.js i korzysta z lokalnych plików PDF.js. -->
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Odwołania2JSON</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Odwołania2JSON</h1>
    <p class="muted" id="health">Łączenie z API…</p>
    <button id="theme-toggle" type="button">Ciemny motyw</button>
  </header>

  <main class="workspace">
    <aside id="documents" class="documents">
      <div class="panel-heading">
        <h2>Dokumenty</h2>
      </div>
    </aside>

    <section class="details">
      <section id="pdf-panel" class="pdf-panel card">
        <div class="panel-heading">
          <h2>Podgląd PDF</h2>
        </div>

        <div class="pdf-toolbar">
          <button id="prev-page" type="button" disabled>Poprzednia</button>
          <span id="page-label" class="muted">Brak dokumentu</span>
          <button id="next-page" type="button" disabled>Następna</button>
          <span class="pdf-zoom-controls" aria-label="Zoom podglądu PDF">
            <button id="zoom-out" type="button" disabled title="Oddal stronę">−</button>
            <button id="zoom-reset" type="button" disabled title="Dopasuj stronę">100%</button>
            <button id="zoom-in" type="button" disabled title="Przybliż stronę">+</button>
          </span>
        </div>

        <div id="pdf-pages"></div>
      </section>

      <section class="right-panel">
        <section id="json-panel" class="card">
          <h2>Wynik JSON</h2>
          <p class="muted">Wybierz przetworzony dokument.</p>
        </section>

        <section id="fields-panel" class="card">
          <h2>Źródła pól</h2>
        </section>
      </section>
    </section>
  </main>

<section class="card upload-card">
    <h2>Wgraj dokumenty PDF</h2>

    <div id="dropzone" class="dropzone" tabindex="0">
      <p>Przeciągnij tutaj pliki PDF</p>
      <p class="muted">lub</p>

      <label class="button" for="files">Wybierz pliki</label>

      <input
        id="files"
        type="file"
        accept="application/pdf"
        multiple
        hidden
      >
    </div>

    <div class="upload-actions">
      <button id="process" type="button" disabled>Przetwórz PDF-y</button>
      <p id="status" class="muted" role="status" aria-live="polite">
        Wybierz pliki, a następnie kliknij „Przetwórz PDF-y”.
      </p>
    </div>
  </section>
<script type="module" src="/static/app.js"></script>
</body>
</html>

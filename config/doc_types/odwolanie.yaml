# =============================================================================
#  Klasa dokumentu: ODWOŁANIE do Prezesa Krajowej Izby Odwoławczej
#  Jeden plik YAML = jedna klasa dokumentu. Dodanie klasy NIE wymaga zmian w kodzie.
#  Opisy pól pochodzą z komentarzy w oczekiwane-json/odwolanie.json (UZP).
# =============================================================================
id: odwolanie
name: Odwołanie do KIO
description: >-
  Pismo wykonawcy (Odwołującego) do Prezesa Krajowej Izby Odwoławczej zawierające zarzuty wobec
  czynności lub zaniechań Zamawiającego w postępowaniu o udzielenie zamówienia publicznego.
version: 1
enabled: true

classification:
  min_score: 5
  signals:
    - { pattern: '^\s*O ?D ?W ?O ?Ł ?A ?N ?I ?E\s*$', weight: 4, case_sensitive: true }
    - { pattern: '\bodwołując\w*', weight: 2 }
    - { pattern: 'krajow\w* izb\w* odwoławcz\w*', weight: 1 }
    - { pattern: '\bzarzut\w*', weight: 2 }
    - { pattern: 'wnosz\w* (o |odwołanie)', weight: 1 }
    - { pattern: 'art\.\s*513', weight: 1 }
  negative_signals:
    # orzeczenia KIO, decyzje, materiały szkoleniowe — dużo słów „odwołanie/odwołujący”, ale to nie odwołanie
    - { pattern: '^\s*(WYROK|POSTANOWIENIE|DECYZJA)\b', weight: 5, scope: head, case_sensitive: true }
    - { pattern: 'sygn\.?\s*akt', weight: 3, scope: head }
    - { pattern: '^\s*pełnomocnictwo( procesowe)?\s*$', weight: 4, scope: head }
    - { pattern: 'potwierdzenie (wykonania |realizacji )?(polecenia )?przelewu', weight: 4 }

extraction:
  max_pages: 4                 # pierwsze strony w całości (tam są dane stron i postępowania)
  keyword_windows:             # dodatkowe fragmenty z dalszych stron (dla czynności i jej daty)
    - 'zarzut\w* nr 1'
    - 'zaskarż\w*'
    - 'w dniu \d{1,2}'
  instructions: |
    - Odwołujący: jeśli odwołanie wnosi konsorcjum, zwróć WYŁĄCZNIE Lidera konsorcjum (jego nazwę, KRS, NIP, REGON).
    - Nie myl Odwołującego z „Wykonawcą wybranym”, przystępującym ani innymi wykonawcami.
    - przez-pelnomocnika = 1, jeśli odwołanie wnosi/podpisuje pełnomocnik (radca prawny, adwokat, kancelaria), inaczej 0.
    - pelnomocnik.imie_nazwisko: PIERWSZY wymieniony pełnomocnik, w mianowniku, bez tytułów (r. pr., adw., mec.).
    - pelnomocnik.nazwa: nazwa kancelarii / podmiotu zatrudniającego pełnomocnika (często w adresie do korespondencji).
    - pelnomocnik.mail: adres e-mail kontaktowy pełnomocnika / do korespondencji.
    - Zamawiający: wszyscy zamawiający. prowadzacy_postepowanie: null gdy zamawiający jest jeden; gdy jest ich więcej —
      1 dla oznaczonego jako prowadzący postępowanie / lider, 0 dla pozostałych.
    - czynnosc_powod_id: wybierz ze słownika na podstawie WYŁĄCZNIE PIERWSZEGO zarzutu.
    - czynnosc_dzien: data czynności (lub zaniechania) zaskarżonej w pierwszym zarzucie.
    - data i miejscowosc: z linii typu „Miejscowość, dnia …” (nagłówek pisma). Brak takiej linii → null.
    - numer_bzp tylko dla ogłoszeń w Biuletynie Zamówień Publicznych; numer_ted tylko dla TED / Dz.U. UE.

output:
  OdwolanieKIO:
    type: object
    properties:
      data:
        type: date
        description: >-
          Data z nagłówka pierwszej strony, z linii typu 'Miejscowość, dnia DD.MM.RRRR' (miesiąc może być
          zapisany słownie). Brak daty w nagłówku → null.
        scope: first_page
        case_sensitive: true
        patterns:
          # „Wpłynęło dnia …” (pieczęć), „Termin 12.03.2026” — nie miejscowość; data także ISO („Kraków, 2026-03-05”)
          - '^\s*(?!(?:Wpłynęł\w*|Data|Termin|Godz\w*|Sygn\w*|Znak|Załącznik\w*|Strona)\b)[A-ZŁŚŻŹĆŃÓ][a-ząćęłńóśźż]+(?:[ -][A-ZŁŚŻŹĆŃÓ][a-ząćęłńóśźż]+){0,2},?\s*(?:dnia\s+|dn\.\s*)?(?P<value>\d{1,2}[./-]\d{1,2}[./-]\d{4}|\d{4}-\d{1,2}-\d{1,2}|\d{1,2}\s+[a-ząćęłńóśźż]+\s+\d{4})'
        normalize: [date_pl]
      czynnosc_dzien:
        type: date
        description: >-
          Data czynności uruchamiającej bieg terminu odwołania dla PIERWSZEGO zarzutu (ISO YYYY-MM-DD).
          Jeśli brak wiarygodnej daty dla pierwszego zarzutu, zwróć null.
        confidence: 0.6   # pole trudne — reguły dają kandydata, LLM może go nadpisać
        patterns:   # „Informacja o zaskarżonej czynności została przekazana … w dniu 01.04.2026 r.”
          - 'zaskarżon\w*\s+czynnoś\w*[^.;]{0,80}?\bw\s+dniu\s+(?P<value>\d{1,2}[./-]\d{1,2}[./-]\d{4}|\d{1,2}\s+[a-ząćęłńóśźż]+\s+\d{4})'
        strategy: date          # pierwsza data w tekście pierwszego zarzutu
        # params: tekst pierwszego zarzutu: po najwcześniejszym z „anchors”, przed uzasadnieniem
        params: &pierwszy_zarzut
          end: ['^\s*UZASADNIENIE', '^\s*Uzasadnienie\s*$']
          # first_item: lista „1)” po kotwicy kończącej linię; tekst w tej samej linii („polegającej na wyborze …”)
          # to już opis czynności. „z naruszeniem” zaczyna przepisy (inne daty, „poprzez zaniechanie …”).
          anchors:
            - { at: 'polegając\w*\s+na\s*:?', first_item: '^\s*1\s*[.)]\s*', until: ['^\s*2\s*[.)]', ';', '^\s*Zarzut', 'z\s+naruszeniem'] }
            - { at: 'wnosz\w*\s+odwołanie\s+(?:wobec|od)\s*:', first_item: '^\s*1\s*[.)]\s*', until: ['^\s*2\s*[.)]', ';', 'z\s+naruszeniem'] }
            - { at: '^\s*Zamawiający\s+w\s+dniu\s+', until: ['\.[ \t]*\n(?![ \t]*(?-i:[a-ząćęłńóśźż]))', '\.\s+(?=(?-i:[A-ZŁŚŻŹĆŃÓ]))'] }   # zdanie: do kropki przed wielką literą / końcem akapitu („2026 r.⏎nie wykluczył” to nie koniec)
            - { at: 'Zarzut\w*\s+(?:nr\s*)?1\b', until: ['Zarzut\w*\s+(?:nr\s*)?2\b', ';'] }
            - { at: 'zarzuca\w*\s+(?:Zamawiającemu\s+)?(?:naruszenie\s*)?:', first_item: '^\s*1\s*[.)]\s*', until: ['^\s*2\s*[.)]', ';'] }
          skip_preceded_by: ['ustaw\w*\s+z\s+(?:dnia\s+)?$']   # data ustawy Pzp („ustawy z dnia 11 września 2019 r.”) to nie data czynności
        normalize: [date_pl]
      czynnosc_powod_id:
        type: integer
        dictionary: czynnosc_powod
        description: >-
          Identyfikator powodu odwołania jako liczba całkowita 1-12 (bez zera wiodącego), ustalany WYŁĄCZNIE
          na podstawie pierwszego zarzutu.
        confidence: 0.6
        strategy: dictionary    # słowa kluczowe ze słownika w tekście pierwszego zarzutu
        params: *pierwszy_zarzut
      czynnosc_opis:
        type: string
        derived_from: czynnosc_powod_id
        dictionary: czynnosc_powod
        description: Kanoniczny opis zaskarżonej czynności zgodny 1:1 z czynnosc_powod_id (ze słownika).
      miejscowosc:
        type: string
        description: >-
          Miejscowość z nagłówka pierwszej strony, z linii typu 'X, dnia ...' albo 'X DD.MM.RRRR'. Brak → null.
        scope: first_page
        case_sensitive: true
        patterns:
          - '^\s*(?!(?:Wpłynęł\w*|Data|Termin|Godz\w*|Sygn\w*|Znak|Załącznik\w*|Strona)\b)(?P<value>[A-ZŁŚŻŹĆŃÓ][a-ząćęłńóśźż]+(?:[ -][A-ZŁŚŻŹĆŃÓ][a-ząćęłńóśźż]+){0,2}),?\s*(?:dnia\s+|dn\.\s*)?(?:\d{1,2}(?:[./-]\d{1,2}[./-]\d{4}|\s+[a-ząćęłńóśźż]+\s+\d{4})|\d{4}-\d{1,2}-\d{1,2})'
        normalize: [strip]
        ground: fuzzy

  Odwolujacy:
    type: array
    min_items: 1
    max_items: 1
    description: Odwołujący (wykonawca wnoszący odwołanie). Przy konsorcjum — tylko Lider konsorcjum.
    scope: head
    section:          # koniec bloku: następna strona postępowania (zamawiający, wykonawca wybrany, przystępujący, uczestnik)
      start: '^\s*(?:Odwołując\w*|Wykonawca\s+wnosząc\w*\s+odwołanie)\s*(?::|[ \t]*$)'
      end: '(^\s*Zamawiając\w*\s*(:|\(|[ \t]*$)|Wykonawca wybrany|^\s*Wykonawc\w*,?\s+(?:wybran\w*|któr\w*\s+ofert\w*)|^\s*Wybran\w*\s+wykonawc\w*|^\s*(?:Przystępując\w*|Uczestni\w*)\b|Przystępując\w*\s*:|^\s*dotyczy\s*:?|^\s*ODWOŁANIE\s*$)'
    item_split: '^\s*\d\s*\)\s*'      # konsorcjum: „1) … (Lider Konsorcjum)”, „2) …” (zaraz po nagłówku bloku)
    item_prefer: 'lider'                # max_items: 1 → zostaje Lider konsorcjum
    items:
      type: object
      properties:
        krs:
          type: string
          description: KRS Odwołującego lub Lidera konsorcjum podmiotów Odwołujących (jeśli występuje).
          patterns: ['KRS[\s:;.]*(?:nr\s*)?(?P<value>\d{10})(?!\d)']
          normalize: [digits_only]
          validate: [krs]
          ground: digits
        nazwa:
          type: string
          description: >-
            Pełna nazwa podmiotu opisanego jako Odwołujący (wykonawca wnoszący odwołanie). Jeśli występuje
            konsorcjum, podaj nazwę Lidera konsorcjum.
          patterns: ['pod\s+firmą\s*:?\s*["„]?(?P<value>[^\n,"”]{3,120})']   # przedsiębiorca (CEIDG): nazwa firmy
          strategy: first_line   # pierwsza linia bloku „Odwołujący:” (albo elementu konsorcjum)
          params:
            skip: ['^\s*Konsorcj\w*\s+(?:wykonawc|firm|w\s+składzie)']
            stop: ['(?:adw\.|adwokat|r\.\s*pr\.|radc\w*\s+prawn|mec\.)']   # pełnomocnik z tytułem to nie nazwa Odwołującego
            cut: ['\s*\(\s*(?:lider|partner|dalej)', ',\s*(?:ul\.|al\.|pl\.|os\.)', '\s+z\s+siedzib\w*']
          normalize: [strip_quotes, collapse_whitespace]
          ground: fuzzy
        nip:
          type: string
          description: NIP Odwołującego lub Lidera konsorcjum (jeśli występuje), 10 cyfr.
          patterns: ['NIP[\s:;.]*(?:PL)?\s*(?P<value>\d(?:[ -]?\d){9})(?![\d-])']
          normalize: [digits_only]
          validate: [nip]
          ground: digits
        regon:
          type: string
          description: REGON Odwołującego lub Lidera konsorcjum (jeśli występuje), 9 lub 14 cyfr.
          patterns: ['REGON[\s:;.]*(?P<value>\d{14}|\d{9})(?!\d)']
          normalize: [digits_only]
          validate: [regon]
          ground: digits
        przez-pelnomocnika:
          type: integer
          enum: [0, 1]
          description: 1 — odwołanie wnosi pełnomocnik, 0 — nie.
          strategy: flag          # 1, gdy w bloku Odwołującego jest reprezentacja przez pełnomocnika
          params:
            # „reprezentowana przez Prezesa Zarządu …” (zarząd, nie pełnomocnik) i sam „adres do korespondencji”
            # nie są dowodem; OCR: „petnomocnika”, „pełnonocnika”
            patterns: ['reprezentowan\w*\s*przez[\s.:]*(?:p\w{0,2}no|adw|r\.?\s*pr|radc|adwokat|mec|kancelari)', 'pe[lłt]no[mn]ocni\w+']
            fallback: true        # przy konsorcjum: cały blok „Odwołujący”, nie tylko element Lidera
            present: 1
            absent: 0
            absent_patterns: ['w\s*imieniu\s+własnym']   # „Działając w imieniu własnym” → 0
            absent_confidence: 0.45                          # brak śladów pełnomocnika → słaba hipoteza 0
        pelnomocnik:
          type: object
          section:                # od „reprezentowany przez (pełnomocnika / adw. / r. pr.)” / „Pełnomocnik:” do końca bloku
            start: 'reprezentowan\w*\s*przez[\s.:]*(?=p\w{0,2}no|adw|r\.?\s*pr|radc|adwokat|mec|kancelari)|^\s*pe[lłt]no[mn]ocni\w*(?:\s+Odwołującego)?\s*:'
          properties:
            imie_nazwisko:
              type: string
              description: Imię i nazwisko (pierwszego) pełnomocnika Odwołującego, w mianowniku, bez tytułów.
              strategy: persons   # pierwsza osoba z listy po „reprezentowany przez (pełnomocnika):”
              params:
                until: ['adres\w*', '\btel\b', 'e-?mail', '^\s*Zamawiając', '\bul\.', '\bKRS\b', '\bNIP\b']
                max_chars: 300
              normalize: [person_name]
              ground: fuzzy
            nazwa:
              type: string
              description: Nazwa podmiotu zatrudniającego pełnomocnika (np. kancelarii).
              section: { start: 'adres\w*\s+do\s+korespondenc\w*\s*:?' }
              strategy: first_line   # „adres do korespondencji: Kancelaria …, ul. …”
              params:
                cut: [',\s*(?:ul\.|al\.|pl\.|os\.)', ',?\s*\d{2}\s?-\s?\d{3}\b']
              normalize: [strip_quotes, collapse_whitespace]
              ground: fuzzy
            mail:
              type: string
              description: Adres e-mail kontaktowy do pełnomocnika.
              patterns: ['(?P<value>[\w.+-]+\s?@\s?[\w-]+(?:\s?\.\s?[\w-]+)+)']
              normalize: [email]
              ground: exact

  Zamawiajacy:
    type: array
    min_items: 1
    description: Zamawiający (jeden lub więcej, gdy postępowanie prowadzą wspólnie).
    scope: head
    section:
      start: '^\s*Zamawiając\w*\s*(:|\(|[ \t]*$)'
      end: '(^\s*Odwołując\w*\s*(:|[ \t]*$)|Wykonawca wybrany|^\s*Wykonawc\w*,?\s+(?:wybran\w*|któr\w*\s+ofert\w*)|^\s*Wybran\w*\s+wykonawc\w*|^\s*(?:Przystępując\w*|Uczestni\w*)\b|Przystępując\w*\s*:|^\s*dotyczy\s*:?|^\s*ODWOŁANIE\s*$)'
    item_split: '^\s*\d\s*\)\s*'      # kilku zamawiających: „1) …”, „2) …”
    items:
      type: object
      properties:
        krs:
          type: string
          description: KRS Zamawiającego (jeśli jawnie podany przy Zamawiającym).
          patterns: ['KRS[\s:;.]*(?:nr\s*)?(?P<value>\d{10})(?!\d)']
          normalize: [digits_only]
          validate: [krs]
          ground: digits
        nazwa:
          type: string
          description: Pełna nazwa podmiotu opisanego jako Zamawiający.
          strategy: first_line   # pierwsza linia bloku „Zamawiający:” (linie-etykiety „… – Lider:” są pomijane)
          params:
            cut: ['\s*\(\s*(?:lider|partner|dalej)', ',\s*(?:ul\.|al\.|pl\.|os\.)', '\s+z\s+siedzib\w*', '\s+[-–]\s+Zamawiaj']
          normalize: [strip_quotes, collapse_whitespace]
          ground: fuzzy
        nip:
          type: string
          description: NIP Zamawiającego (jeśli jawnie podany przy Zamawiającym).
          patterns: ['NIP[\s:;.]*(?:PL)?\s*(?P<value>\d(?:[ -]?\d){9})(?![\d-])']
          normalize: [digits_only]
          validate: [nip]
          ground: digits
        regon:
          type: string
          description: REGON Zamawiającego (jeśli jawnie podany przy Zamawiającym).
          patterns: ['REGON[\s:;.]*(?P<value>\d{14}|\d{9})(?!\d)']
          normalize: [digits_only]
          validate: [regon]
          ground: digits
        prowadzacy_postepowanie:
          type: integer
          enum: [0, 1]
          description: >-
            null — jeśli zamawiający jest jeden; 1 — jeśli zamawiających jest więcej i ten jest oznaczony jako
            prowadzący postępowanie / lider; 0 — jeśli zamawiających jest więcej i ten nie jest prowadzącym.
          strategy: item_flag     # jeden zamawiający → brak wartości; kilku → 1 dla oznaczonego, 0 dla pozostałych
          params:
            pattern: 'prowadząc\w*\s+postępowani\w*|\blider\w*'

  ZamowieniePubliczne:
    type: object
    scope: head      # dane postępowania są w nagłówku; dalej (uzasadnienie) bywają numery INNYCH postępowań
    properties:
      numer_bzp:
        type: string
        description: >-
          Numer ogłoszenia w BZP (jeśli występuje). Format 'YYYY/BZP ########' (opcjonalnie '/##' dla korekt),
          bez spacji po normalizacji. NIE wpisuj tu numerów TED.
        patterns: ['(?P<value>\d{4}\s*/\s*BZP\s*\d{6,9}(?:\s*/\s*\d{1,2})?)']
        normalize: [bzp]
        ground: digits
      numer_postepowania:
        type: string
        description: >-
          Numer referencyjny / nr postępowania / numer wewnętrzny (ID po etykiecie), np. 'ZP.039.2025',
          'DZP.260.11.2025', 'V.ROZ.2710.125.2025', 'ZSCKR/822/2025'.
        labels: [nr referencyjny, numer referencyjny, znak sprawy, nr sprawy, numer sprawy, nr postępowania, numer postępowania]
        value_pattern: '(?=[A-Z0-9./_-]*\d)[A-Z0-9][A-Za-z0-9./_-]*[A-Za-z0-9]'
        patterns:   # wartość musi zawierać cyfrę: „Numer referencyjny postępowania: ZP.1” nie daje „postępowania”
          - '(?:nr|numer)\s*(?:referencyjn\w*|postępowania|sprawy)(?:\s+sprawy)?\s*:?\s*(?P<value>(?=[A-Za-z./_-]*\d)[A-Z0-9][A-Za-z0-9./\-_]*[A-Za-z0-9])'
          - 'postępowanie\s+nr\s+(?P<value>(?=[A-Za-z./_-]*\d)[A-Z0-9][A-Za-z0-9./\-_]*[A-Za-z0-9])'
        normalize: [strip]
        ground: exact
      numer_ted:
        type: string
        description: >-
          Numer TED (jeśli występuje), zwykle 'NNNNNN-YYYY' (np. '363730-2025'). Może wystąpić jako
          'YYYY/S ###-NNNNNN' — zapisz jako 'NNNNNN-YYYY'.
        patterns:
          - '(?:\bTED\b|Dz\.?\s*U\.?\s*UE|Dzienni\w*\s*Urz\w*\s*(?:Unii\s*Europejskiej|UE))[\s\S]{0,80}?(?P<value>\d{4}\s*/\s*S\s*\d{1,3}\s*-\s*\d{5,8}|\d{5,8}\s*-\s*\d{4})(?!\d)'
        normalize: [ted]
        ground: digits
      tytul:
        type: string
        description: Tytuł (nazwa) zamówienia lub postępowania, jeśli występuje w dokumencie — bez cudzysłowów.
        patterns:   # OCR gubi cudzysłów otwierający („ → brak / „,”) — wystarczy zamykający
          # tytuł nie przechodzi przez „, nr …”, „nr referencyjny”, „ogłoszenie o zamówieniu”, „(dalej” ani nagłówek
          # ODWOŁANIE — bez cudzysłowów (OCR) inaczej sięgałby do najbliższego cudzysłowu w treści pisma
          - '(?:\bpn\.?|pod\s+nazwą|o\s+nazwie)\s*:?\s*[„"“,]?\s*(?P<value>(?:(?!,\s*(?:nr|numer|znak)\b|\b(?:nr|numer)\s+(?:referencyjn|postępowania|sprawy)|ogłoszeni\w*\s+(?:o\s+zamówieniu|nr\b)|\(\s*dalej|\n\s*ODWOŁANIE)[^”"“„]){5,500}?)\s*[”"“]'
        normalize: [strip_quotes, collapse_whitespace]
        ground: fuzzy

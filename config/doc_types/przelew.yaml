# =============================================================================
#  Klasa dokumentu: POTWIERDZENIE PRZELEWU (wpis od odwołania / opłata skarbowa)
#  Jeden plik YAML = jedna klasa dokumentu. Dodanie klasy NIE wymaga zmian w kodzie.
#  Opis formatu: docs/NOWA_KLASA_DOKUMENTU.md
# =============================================================================
id: przelew
name: Potwierdzenie przelewu bankowego
description: >-
  Potwierdzenie wykonania przelewu bankowego wygenerowane przez bank (np. wpis od odwołania
  na rachunek UZP albo opłata skarbowa od pełnomocnictwa).
version: 1
enabled: true

# --- 1. Rozpoznawanie dokumentu --------------------------------------------
classification:
  min_score: 4
  signals:
    - { pattern: 'potwierdzenie (wykonania |realizacji )?(polecenia )?przelewu|polecenie przelewu|dowód wykonania przelewu|potwierdzenie (operacji bankowej|transakcji)|potwierdzenie przelewu', weight: 4, scope: head }
    - { pattern: '\bprzelew\w*', weight: 2, scope: head }       # "Przelew krajowy", "Typ przelewu"
    - { pattern: 'rachunek (odbiorcy|beneficjenta|uznawany|kontrahenta)|na rachunek', weight: 2 }
    - { pattern: 'rachunek (zleceniodawcy|nadawcy|obciążany)|z rachunku', weight: 2 }
    - { pattern: '\b(PL ?)?\d{2}(?: ?\d{4}){6}\b', weight: 1 }  # numer rachunku (NRB/IBAN)
    - { pattern: '\bkwota\b', weight: 1 }
    - { pattern: 'tytu\w{0,2}em|tytuł przelewu|\btytuł\b', weight: 1 }   # "Tytutem" = OCR "Tytułem"
    - { pattern: '\bstatus\b|wykonan[ey]|zrealizowan\w*', weight: 1 }
    - { pattern: 'bankowości (elektronicznej|internetowej)|elixir|kontrahent\w*', weight: 1 }
  negative_signals:
    - { pattern: '^\s*ODWOŁANIE\s*$', weight: 4, case_sensitive: true }
    - { pattern: 'udziela\w* pełnomocnictwa', weight: 3 }
    # ogłoszenia o zamówieniu (TED/BZP) wspominają „przelewem na rachunek” (wadium) i mają pole „Tytuł:”
    - { pattern: 'see the notice on ted|procedura konkurencyjna|ogłoszenie o zamówieniu|oficjalna nazwa|dziennik urzędowy|\bOJ S\b', weight: 4 }

# --- 2. Wskazówki dla ekstrakcji LLM ---------------------------------------
extraction:
  instructions: |
    - Przepisuj wartości dokładnie tak, jak w dokumencie; nie zgaduj — brak danych → null.
    - na_rachunek = rachunek ODBIORCY/beneficjenta; z_rachunku = rachunek ZLECENIODAWCY/nadawcy/obciążany.
    - Numery rachunków: same cyfry (bez „PL” i spacji).
    - numer_transakcji: numer referencyjny / identyfikator operacji (NIE numer klienta).
    - tytul: pełny tytuł/opis przelewu (bez zewnętrznych cudzysłowów).

# --- 3. Struktura wyniku (kanoniczny JSON) ---------------------------------
output:
  przelew_bankowy:
    type: object
    properties:
      data_operacji:
        type: date
        description: Data wykonania/realizacji przelewu (ISO YYYY-MM-DD).
        labels: [Data operacji, Data transakcji, Data wykonania, Zlecona data wykonania, Data realizacji, Data księgowania, Data i godzina operacji, Data i godzina transakcji]
        patterns:   # pismo banku: „Bank potwierdza, że w dniu 26 kwietnia 2026 z rachunku nr …”
          - 'w dniu\s+(?P<value>\d{1,2}[./-]\d{1,2}[./-]\d{4}|\d{4}-\d{1,2}-\d{1,2}|\d{1,2}\s+[a-ząćęłńóśźż]+\s+\d{4})\s*(?:r\.\s*)?,?\s*z\s+rachunku'
        normalize: [date_pl]
      kwota:
        type: number
        description: Kwota przelewu w PLN jako liczba (np. 15000.00).
        labels: [Kwota operacji, Kwota przelewu, Kwota transakcji, Kwota, Wartość operacji, Wartość]
        patterns: ['w kwocie\s+(?P<value>\d[\d  .,]*\d(?:\s*(?:PLN|zł))?)']   # pismo banku
        normalize: [amount_pl]
      na_rachunek:
        type: string
        description: Numer rachunku odbiorcy — same cyfry (26), bez „PL” i spacji.
        labels: [Rachunek odbiorcy, Numer rachunku odbiorcy, Nr rachunku odbiorcy, Rachunek beneficjenta, Rachunek uznawany, Rachunek kontrahenta, Konto odbiorcy, Na rachunek, Na konto]
        value_pattern: '(?:PL)?[ ]?\d{2}(?:[ ]?\d){24}(?!\d)'
        patterns:
          # dwie kolumny: „Płatnik  Beneficjent” … wiersz z dwoma rachunkami → prawy
          - '(?:Płatnik|Nadawca|Zleceniodawca|Dane nadawcy|Dane zleceniodawcy)[ \t]+(?:Beneficjent|Odbiorca|Dane odbiorcy|Dane kontrahenta|Adresat\w*(?: przelewu)?)[ \t]*\n(?:[^\n]*\n){0,3}?[ \t]*(?:PL)?[ ]?\d{2}(?:[ ]?\d){24}[ \t]+(?P<value>(?:PL)?[ ]?\d{2}(?:[ ]?\d){24})[ \t]*$'
          # pismo banku: „… na rachunek nr 56 2417 …”
          - '(?<![^\W\d_])na\s+rachunek(?:\s+nr)?\s*:?\s*(?P<value>(?:PL)?\s?\d{2}(?:\s?\d){24})(?!\d)'
          # blok „Dane odbiorcy” / „Dane kontrahenta” (np. tabela: Nazwa i adres | Numer rachunku | Nazwa banku)
          - 'Dane (?:odbiorcy|kontrahenta|beneficjenta)[ \t]*\n(?:(?!Dane (?:nadawcy|zleceniodawcy))[\s\S]){0,250}?(?P<value>(?<![\dA-Z])(?:PL)?[ ]?\d{2}(?:[ ]?\d){24})(?!\d)'
        normalize: [account_number]
        validate: [iban_pl]
        ground: digits
      numer_transakcji:
        type: string
        description: Numer referencyjny / identyfikator transakcji nadany przez bank (jeśli występuje).
        labels: [Numer referencyjny transakcji, Numer referencyjny operacji, Numer referencyjny, Nr referencyjny, Nr ref., Identyfikator operacji, Identyfikator transakcji, Numer transakcji operacji, Numer transakcji, Nr transakcji, Numer operacji, Nr operacji, ID transakcji, ID operacji]
        value_pattern: '(?=[A-Z/-]*\d)[A-Z0-9][A-Z0-9/-]{5,}'
        normalize: [strip]
        ground: exact
      tytul:
        type: string
        description: Tytuł przelewu (pole „Tytuł” / „Tytułem” / „Opis”), dokładnie jak w dokumencie.
        labels: [Tytuł przelewu, Tytułem, Tytuł, Szczegóły płatności, Opis]
        max_lines: 5   # długi tytuł łamie się na kilka linii
        # etykieta pisana wielką literą kończy tytuł; ciąg dalszy tytułu małą literą („nr ZP.271.1.2026”) — nie
        stop: ['(?=(?-i:[A-ZŁŚŻŹĆŃÓ]))(?:Status|Waluta|Typ|Kanał|Tryb|Opłata|Prowizja|Numer|Nr|Kwota|Data|Identyfikator|ID|Nadawca|Odbiorca|Zleceniodawca|Beneficjent|Adresat|Rachunek|Płatnik|Dane|Bank|Dokument|Wartość|Szczegóły|Potwierdzenie|Nazwa|Adres|Signature|Z poważaniem|ZREALIZOWAN\w*|WYKONAN\w*)\b', '\*{3}', '-{5}']
        normalize: [strip_quotes, collapse_whitespace]
        ground: fuzzy
      z_rachunku:
        type: string
        description: Numer rachunku zleceniodawcy (obciążanego) — same cyfry (26), bez „PL” i spacji.
        labels: [Rachunek zleceniodawcy, Numer rachunku zleceniodawcy, Rachunek nadawcy, Numer rachunku nadawcy, Nr rachunku nadawcy, Rachunek obciążany, Rachunek płatnika, Konto nadawcy, Z rachunku, Z konta]
        value_pattern: '(?:PL)?[ ]?\d{2}(?:[ ]?\d){24}(?!\d)'
        patterns:
          # dwie kolumny: „Płatnik  Beneficjent” … wiersz z dwoma rachunkami → lewy
          - '(?:Płatnik|Nadawca|Zleceniodawca|Dane nadawcy|Dane zleceniodawcy)[ \t]+(?:Beneficjent|Odbiorca|Dane odbiorcy|Dane kontrahenta|Adresat\w*(?: przelewu)?)[ \t]*\n(?:[^\n]*\n){0,3}?[ \t]*(?P<value>(?:PL)?[ ]?\d{2}(?:[ ]?\d){24})[ \t]+(?:PL)?[ ]?\d{2}(?:[ ]?\d){24}[ \t]*$'
          # pismo banku: „… z rachunku nr 34 3654 …”
          - '(?<![^\W\d_])z\s+rachunku(?:\s+nr)?\s*:?\s*(?P<value>(?:PL)?\s?\d{2}(?:\s?\d){24})(?!\d)'
          # blok „Dane nadawcy” / „Dane zleceniodawcy”
          - 'Dane (?:nadawcy|zleceniodawcy)[ \t]*\n(?:(?!Dane (?:odbiorcy|kontrahenta|beneficjenta))[\s\S]){0,250}?(?P<value>(?<![\dA-Z])(?:PL)?[ ]?\d{2}(?:[ ]?\d){24})(?!\d)'
          # „Przelew z rachunku …” / „Numer rachunku 78 1020 …”
          - 'z\s+rachunku\b[^\n]*\n[ \t]*Numer\s+rachunku[ \t:]*(?P<value>(?:PL)?[ ]?\d{2}(?:[ ]?\d){24})(?!\d)'
        normalize: [account_number]
        validate: [iban_pl]
        ground: digits
